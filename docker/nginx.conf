# Staging runtime nginx site — pairs with docker/supervisord.conf (php-fpm
# listens on 127.0.0.1:9000, the image default). Caddy (a separate compose
# service) is the actual internet-facing reverse proxy; this nginx is only
# reachable inside the compose network at hr-backend:80.
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
